<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brydon Projects LLC</title>
<meta name="description" content="Brydon Projects LLC provides software development and consulting services.">
<style>
  :root { color-scheme: light dark; --bg: #fff; --fg: #16181d; --muted: #5b616e; --line: #d9dce3; }
  @media (prefers-color-scheme: dark) { :root { --bg: #14161a; --fg: #eef0f4; --muted: #a2a8b5; --line: #30343c; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 18px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { min-height: 100vh; box-sizing: border-box; max-width: 40rem; margin: 0 auto; padding: 4rem 1.5rem; display: flex; flex-direction: column; justify-content: center; }
  h1 { margin: 0 0 .75rem; font-size: clamp(2rem, 7vw, 3rem); line-height: 1.1; letter-spacing: -.02em; }
  p { margin: 0; }
  .contact { margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--line); }
  a { color: inherit; text-underline-offset: .2em; }
  footer { margin-top: 3rem; color: var(--muted); font-size: .85rem; }
</style>
</head>
<body>
<main>
  <h1>Brydon Projects LLC</h1>
  <p>Software development and consulting services.</p>
  <p class="contact">Contact: <a href="mailto:hello@brydonprojects.us">hello@brydonprojects.us</a></p>
  <footer>© 2026 Brydon Projects LLC</footer>
</main>
</body>
</html>
